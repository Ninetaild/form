<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Routine Kit</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main>
  <h1>Form Routine Kit</h1>
  <p class="lead">공개 Kit을 불러와 브라우저 확장 프로그램으로 실행합니다.</p>
  <label>Kit 선택<select id="kitSelect"></select></label>
  <label>이름<input id="name" autocomplete="name"></label>
  <label>연락처<input id="phone" inputmode="tel" autocomplete="tel"></label>
  <section class="notice">
    <h2>이용 전 확인</h2>
    <p>이 서비스는 이름과 연락처를 자체 서버로 전송하거나 개발자에게 수집하지 않습니다. 입력한 정보는 이용자의 브라우저에서 해당 설문 페이지에 입력하기 위한 용도로만 사용됩니다.</p>
    <p>설문에 입력·제출된 개인정보는 이벤트 주최측 또는 설문에 명시된 제3자에게 제공될 수 있습니다. 각 설문의 개인정보 수집·이용 및 제3자 제공 내용을 직접 확인해 주세요.</p>
  </section>
  <label class="check"><input type="checkbox" id="agree"> 위 내용을 읽고 이해했습니다.</label>
  <button id="start" disabled>확장 프로그램에서 실행</button>
  <p id="status"></p>
</main>
<script src="./app.js"></script>
</body>
</html>
