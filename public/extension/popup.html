<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{width:360px;font:14px system-ui;padding:12px;margin:0}h3{margin-top:0}label{display:block;margin:8px 0 4px}input,select,button{box-sizing:border-box;width:100%;padding:8px}button{margin-top:8px}.notice{font-size:12px;background:#f5f5f5;padding:8px;margin-top:10px}.check{display:flex;gap:6px;align-items:flex-start}.check input{width:auto}.muted{color:#666;font-size:12px}#analysis{white-space:pre-wrap;font-size:12px;max-height:300px;overflow:auto;margin-top:8px}</style></head><body><h3>Form Routine Kit</h3><label>Kit<select id="kit"></select></label><label>이름<input id="name" autocomplete="name"></label><label>연락처<input id="phone" inputmode="tel"></label><div class="notice">이름·연락처는 이 확장 프로그램의 자체 서버로 전송하지 않습니다. 설문에 제출된 정보는 해당 폼의 운영자/제3자에게 제공될 수 있습니다. 각 설문의 개인정보 안내를 확인하세요.</div><label class="check"><input type="checkbox" id="agree"> <span>위 내용을 읽고 이해했습니다.</span></label><button id="start" disabled>첫 번째 폼 열기 및 준비</button><button id="run">현재 탭에서 실행</button><button id="analyze">현재 페이지 읽기 / Kit 만들기</button><p id="status" class="muted"></p><pre id="analysis"></pre><script src="popup.js"></script></body></html>
