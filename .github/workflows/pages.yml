name: Build and Deploy Form Routine Kit
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package extension only
        run: |
          rm -rf public/download dist-extension
          mkdir -p public/download
          cd dist-extension 2>/dev/null || true
          if [ -d "$GITHUB_WORKSPACE/dist-extension" ]; then
            cd "$GITHUB_WORKSPACE/dist-extension"
            zip -r "$GITHUB_WORKSPACE/public/download/form-routine-kit-extension.zip" .
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4